# These tasks are available everywhere

# Configure this to lint scripts by filetype
[lint]
command=echo "No linter configured"
output=quickfix

[shell]
command=bash
output=terminal
pos=bottom

[run]
command=:echo "No runner configured for file type $(VIM_FILETYPE)"
command:c,cpp="$(VIM_PATHNOEXT)"
command:go="$(VIM_PATHNOEXT)"
command:make=make -f "$(VIM_FILEPATH)" run
command:emake=emake -e "$(VIM_FILEPATH)"
command:javascript=node "$(VIM_FILEPATH)"
command:sh=sh "$(VIM_FILEPATH)"
command:lua=lua "$(VIM_FILEPATH)"
command:perl=perl "$(VIM_FILEPATH)"
command:ruby=ruby "$(VIM_FILEPATH)"
command:zsh=zsh "$(VIM_FILEPATH)"
command:bash=bash "$(VIM_FILEPATH)"
command:fish=fish "$(VIM_FILEPATH)"
command:php=php "$(VIM_FILEPATH)"
command:erlang=escript "$(VIM_FILEPATH)"
command:ps1=powershell -file "$(VIM_FILEPATH)"
command:scala=scala "$(VIM_FILEPATH)"
command:haskell=ghci "$(VIM_FILEPATH)"
command:applescript=osascript "$(VIM_FILEPATH)"
command:vim=:source %
# If <root>\.venv\Scripts\python.exe exists, use it; otherwise use plain `python`
command:python=cmd /c "if exist $(VIM_ROOT)\venv\Scripts\python.exe ( $(VIM_ROOT)\venv\Scripts\python.exe $(VIM_FILEPATH) ) else ( python $(VIM_FILEPATH) )"

command:kotlin=bash -lc "file=\"$(VIM_FILENAME)\"; base=\"$(VIM_FILENOEXT)\"; if [[ \"$file\" == *.kts ]]; then echo \"Running script: $file\"; kotlinc -script \"$file\"; elif [[ \"$file\" == *.kt ]]; then echo \"Compiling: $file\"; mkdir -p out && kotlinc \"$file\" -d out && kotlin -classpath out \"${base}Kt\"; else echo \"Not a Kotlin file\"; exit 1; fi"

output=terminal
cwd=$(VIM_ROOT)
save=2
close=0

