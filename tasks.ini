[lint]
command=echo "No linter configured"
output=quickfix

[shell]
command=bash
output=terminal

[run]
# Run from the project root so packages like py_tools import cleanly
cwd=$(VIM_ROOT)
cwd:kotlin=$(VIM_FILEDIR)

# If <root>\.venv\Scripts\python.exe exists, use it; otherwise use plain `python`
command:python=cmd /c "if exist $(VIM_ROOT)\.venv\Scripts\python.exe ( $(VIM_ROOT)\.venv\Scripts\python.exe $(VIM_FILEPATH) ) else ( python $(VIM_FILEPATH) )"
command:kotlin=bash -lc "file=\"$(VIM_FILENAME)\"; base=\"$(VIM_FILENOEXT)\"; if [[ \"$file\" == *.kts ]]; then echo \"Running script: $file\"; kotlinc -script \"$file\"; elif [[ \"$file\" == *.kt ]]; then echo \"Compiling: $file\"; mkdir -p out && kotlinc \"$file\" -d out && kotlin -classpath out \"${base}Kt\"; else echo \"Not a Kotlin file\"; exit 1; fi"

output=terminal
close_on_exit=0
